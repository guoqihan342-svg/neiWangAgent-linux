[project]
name = "GraphForge"
version = "0.3.1"
description = "GraphForge — 图引擎驱动的多Agent代码自动化工具"
requires-python = ">=3.10"
dependencies = [
    "click>=8.1,<9.0",  # tested with 8.3.3
    "httpx>=0.24,<0.29",  # tested with 0.28.1
    "networkx>=3.0,<4.0",  # tested with 3.6.1
    "psycopg2-binary>=2.9,<3.0",  # tested with 2.9.12
    "pydantic>=2.0,<3.0",  # tested with 2.13.4
    "pyyaml>=6.0,<7.0",  # tested with 6.0.3
    "tree-sitter>=0.20,<0.21",  # tested with 0.20.4
    "tree-sitter-languages>=1.10,<2.0",  # tested with 1.10.2
]

[project.optional-dependencies]
db = ["psycopg2-binary>=2.9,<3.0"]

[project.scripts]
graphforge = "graphforge.cli:main"

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"
