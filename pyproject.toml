[project]
name = "GraphForge"
version = "0.3.0"
description = "GraphForge — 图引擎驱动的多Agent代码自动化工具"
requires-python = ">=3.10"
dependencies = [
    "click>=8.1",
    "pydantic>=2.0",
    "pyyaml>=6.0",
    "httpx>=0.24",
]

[project.optional-dependencies]
db = ["psycopg2-binary>=2.9"]

[project.scripts]
graphforge = "graphforge.cli:main"

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"
